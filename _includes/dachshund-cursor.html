<!-- Cursor mascot: pixel-art dachshund that trots after the pointer on desktop.
     Only two of the source frames have the ear at rest (neutral.png, walk-b.png);
     those two double as idle + both "halves" of the walk cycle. Frame <img> src
     attributes are hydrated by js/dachshund-cursor.js only after it confirms a
     fine pointer + hover capability, so touch devices never fetch them. -->
<div class="cursor-dachshund" id="cursorDachshund" aria-hidden="true">
  <img class="is-active" data-frame="neutral" data-src="/assets/mascot/neutral.png" alt="" width="1146" height="706">
  <img data-frame="walk-b" data-src="/assets/mascot/walk-b.png" alt="" width="1146" height="706">
  <img data-frame="flap-1" data-src="/assets/mascot/flap-1.png" alt="" width="1146" height="706">
  <img data-frame="flap-2" data-src="/assets/mascot/flap-2.png" alt="" width="1146" height="706">
  <img data-frame="flap-3" data-src="/assets/mascot/flap-3.png" alt="" width="1146" height="706">
  <img data-frame="flap-4" data-src="/assets/mascot/flap-4.png" alt="" width="1146" height="706">
  <img data-frame="flap-5" data-src="/assets/mascot/flap-5.png" alt="" width="1146" height="706">
</div>
