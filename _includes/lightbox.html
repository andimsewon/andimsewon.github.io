<div class="lightbox-backdrop" id="lightbox" role="dialog" aria-modal="true" aria-label="{% if include.lang == 'ko' %}이미지 미리보기{% else %}Image preview{% endif %}">
  <div class="lightbox-content">
    <div class="lightbox-close" id="lightboxClose" aria-label="{% if include.lang == 'ko' %}닫기{% else %}Close{% endif %}">×</div>
    <img src="" alt="" id="lightboxImg" class="lightbox-img">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>
