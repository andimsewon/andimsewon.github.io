name: SEO validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build production site
        run: bundle exec jekyll build --trace
      - name: Validate SEO, structured data, sitemap, and links
        run: bundle exec ruby scripts/validate_seo.rb
